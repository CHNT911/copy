name: CopyReader
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CopyReader:
    type: application
    platform: iOS
    sources:
      - path: CopyReader
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.copyreader
        PRODUCT_NAME: CopyReader
        INFOPLIST_FILE: CopyReader/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_EMIT_LOC_STRINGS: NO
    scheme:
      testTargets: []
